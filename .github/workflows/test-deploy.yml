name: TEST DEPLOY

on:
  push:
    branches: [ '**', '!trunk', '!production' ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Parse ticket tag from commit message
        id: ticket
        run: |
          MSG=${{ toJSON(github.event.head_commit.message) }}
          if [[ "$MSG" =~ \[Tests\ ([A-Z]+-[0-9]+)\] ]]; then
            echo "id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ticket.outputs.matched == 'true'
        with:
          fetch-depth: 0

      - name: Install build dependencies
        if: steps.ticket.outputs.matched == 'true'
        run: sudo apt-get install -y bmake curl jq rsync

      - name: Merge ${{ github.event.repository.default_branch }} before building
        if: steps.ticket.outputs.matched == 'true'
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name  "eae-ci"
          git config user.email "ci@energyaccessexplorer.org"
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git merge --no-edit "origin/$BASE"
          test "$(git rev-list --count HEAD..origin/$BASE)" = "0"

      - name: Pick paver endpoint (ticket-specific if deployed, else default)
        if: steps.ticket.outputs.matched == 'true'
        id: paver
        run: |
          TICKET_URL="https://paver.energyaccessexplorer.org/${{ steps.ticket.outputs.id }}/paver"
          if curl --fail --silent --show-error --max-time 30 -X OPTIONS --output /dev/null "$TICKET_URL/check"; then
            echo "endpoint=$TICKET_URL" >> "$GITHUB_OUTPUT"
          else
            echo "endpoint=${{ vars.PAVER_ENDPOINT }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build test.mk from secrets
        if: steps.ticket.outputs.matched == 'true'
        run: |
          cat > test.mk <<EOF
          DT_BASE = "/${{ steps.ticket.outputs.id }}/admin"
          DT_LOGO = "/${{ steps.ticket.outputs.id }}/admin/lib/images/eae-logo.svg"
          DT_API = "${{ vars.DT_API }}"
          AUTH_SERVER = "${{ vars.AUTH_SERVER }}"
          AUTH_WORLD = "${{ vars.AUTH_WORLD }}"
          DT_PRODUCTION = "${{ vars.DT_PRODUCTION }}"
          DT_UPLOAD = "${{ vars.DT_UPLOAD }}"
          PAVER_ENDPOINT = "${{ steps.paver.outputs.endpoint }}"
          DEPARTER_ENDPOINT = "${{ vars.DEPARTER_ENDPOINT }}"
          BUCKET_ENDPOINT = "${{ vars.BUCKET_ENDPOINT }}"
          EOF

      - name: Build
        if: steps.ticket.outputs.matched == 'true'
        run: bmake env=test build

      - name: Make destination directory
        if: steps.ticket.outputs.matched == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host:     ${{ secrets.PR_DEPLOY_HOST }}
          username: ${{ secrets.PR_DEPLOY_USER }}
          port:     ${{ secrets.PR_DEPLOY_PORT }}
          key:      ${{ secrets.PR_DEPLOY_KEY }}
          script:   mkdir -p ${{ secrets.PR_DEPLOY_PATH }}/${{ steps.ticket.outputs.id }}/admin

      - name: Deploy
        if: steps.ticket.outputs.matched == 'true'
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches:    --recursive --verbose
          path:        dist/
          remote_path: ${{ secrets.PR_DEPLOY_PATH }}/${{ steps.ticket.outputs.id }}/admin/
          remote_host: ${{ secrets.PR_DEPLOY_HOST }}
          remote_port: ${{ secrets.PR_DEPLOY_PORT }}
          remote_user: ${{ secrets.PR_DEPLOY_USER }}
          remote_key:  ${{ secrets.PR_DEPLOY_KEY }}
