<form id="form-"
      style="text-align: right;">
  <div class="input-group">
    <label>Value column</label>

    <select name="attr"
            bind-value="attr"
            required>
      <option selected
              disabled>Select one</option>

      <option bind-each="_available_properties"
              bind-value="v"
              bind="v"></option>
    </select>
  </div>

  <div class="input-group">
    <label>lng/lat columns</label>

    <input name="lnglat"
           type="text"
           placeholder="longitude,latitude"
           pattern="^[a-zA-Z]+,[a-zA-Z]+$"
           required>
  </div>
</form>
