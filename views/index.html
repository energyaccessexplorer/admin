<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">

    <script type="module">
      import dt from './lib/dt.js';
      import * as config from './config.js';

      dt.main(config);
    </script>

    <link rel="shortcut icon" type="image/png" href="./lib/images/eae-logo.svg">

    <link rel="stylesheet" href="./lib/eae-style.css">
    <link rel="stylesheet" href="./lib/eae-nav.css">

    <link rel="stylesheet" href="./lib/dt-style.css">

    <style>
      :root {
        --a-foreground: var(--the-green) !important;
        --nav-background: var(--the-green) !important;
        --nav-a-foreground: var(--the-white) !important;
      }

      body {
        font-family: without-serif, sans-serif !important;
        display: initial !important;
      }

      body > main header {
        width: 100% !important;
        max-width: 100% !important;
        position: relative;
      }

      nav {
        display: none;
      }

      nav #navigation-links {
        justify-content: right !important;
        gap: 1em !important;
      }

      body > main > header > .actions-drawer {
        position: absolute !important;
      }

      td.created,
      td.updated {
        font-size: 0.9em;
        font-family: monospace;
      }

      .bi-empty {
        min-width: 1em;
        display: block;
      }
    </style>

    <title>Admin :: Energy Access Explorer</title>
  </head>

  <body>
    <nav>
      <input id="toggle" class="no-desktop" type="checkbox">

      <label for="toggle" class="no-desktop">
        <svg style="width:24px;height:24px" viewBox="0 0 24 14">
          <path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"></path>
        </svg>
      </label>

      <a id="energy-access-link" href="/">
        <img src="https://www.energyaccessexplorer.org/images/EAE Logo_Horizontal White.svg"
             style="width: 280px; margin-top: 4px;">
      </a>

      <div id="navigation-links">
        <a href="./?model=geographies" class="toggleable">
          Geographies
        </a>

        <a href="./?model=categories" class="toggleable">
          Categories
        </a>

        <a href="./?model=users" class="toggleable">
          Users
        </a>

        <a href="./?model=status" class="toggleable">
          System Status
        </a>

        <a href="./?model=analytics" class="toggleable">
          Analytics
        </a>

        <a href="./?login" class="toggleable">
          Log Out
        </a>
      </div>
    </nav>
  </body>

  <script type="module">
    import {
      ce,
      maybe,
      qs,
      tmpl,
      until,
    } from './lib/helpers.js';

    document.addEventListener("DOMContentLoaded", async function() {
      const dtnav = document.querySelector('nav#dt-nav');
      if (!dtnav) return;
      dtnav.remove();

      let role; await until(_ => role = maybe(window.SELF, 'role'));
      if (!role) return;

      if (['guest'].includes(role)) {
        const p = document.createElement('p');
        p.style = "margin: 2em;";
        p.innerHTML = "As a <strong>guest</strong> account, you are not allowed to access the admin panel. <br><br>";

        const a = document.createElement('a');
        a.href = "https://www.energyaccessexplorer.org/";
        a.innerText = "Back to website";
        p.append(a);

        document.body.replaceChildren(p);

        return;
      }

      const links = qs('#navigation-links');

      if (!['leader', 'manager', 'director', 'root'].includes(role)) {
        qs('[href="./?model=users"]', links).remove();
        qs('[href="./?model=status"]', links).remove();
      }

      if (!['director', 'root'].includes(role)) {
        qs('[href="./?model=analytics"]', links).remove();
      }

      qs('body > nav').style.display = 'flex';
    });
  </script>
</html>
